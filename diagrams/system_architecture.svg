<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .layer-box { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
      .component-box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .frontend-box { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .api-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .business-box { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .ai-box { fill: #d1fae5; stroke: #059669; stroke-width: 1.5; }
      .data-box { fill: #fef08a; stroke: #ca8a04; stroke-width: 1.5; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #475569; }
      .layer-title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-bold { stroke: #ef4444; stroke-width: 3; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" style="font-family: Arial; font-size: 24px; font-weight: bold; fill: #0f172a;">
    RAG 聊天机器人系统架构图
  </text>
  <text x="600" y="50" text-anchor="middle" style="font-family: Arial; font-size: 12px; fill: #64748b;">
    System Architecture Diagram
  </text>

  <!-- Frontend Layer -->
  <rect x="50" y="80" width="1100" height="100" class="layer-box" rx="5"/>
  <text x="70" y="105" class="layer-title">前端层 (Frontend Layer)</text>

  <rect x="200" y="120" width="150" height="50" class="frontend-box" rx="3"/>
  <text x="275" y="140" text-anchor="middle" class="title-text">Web Browser</text>
  <text x="275" y="155" text-anchor="middle" class="subtitle-text">浏览器</text>

  <rect x="380" y="120" width="150" height="50" class="frontend-box" rx="3"/>
  <text x="455" y="140" text-anchor="middle" class="title-text">HTML/CSS/JS</text>
  <text x="455" y="155" text-anchor="middle" class="subtitle-text">前端界面</text>

  <rect x="560" y="120" width="150" height="50" class="frontend-box" rx="3"/>
  <text x="635" y="140" text-anchor="middle" class="title-text">script.js</text>
  <text x="635" y="155" text-anchor="middle" class="subtitle-text">客户端逻辑</text>

  <rect x="740" y="120" width="150" height="50" class="frontend-box" rx="3"/>
  <text x="815" y="140" text-anchor="middle" class="title-text">Marked.js</text>
  <text x="815" y="155" text-anchor="middle" class="subtitle-text">Markdown渲染</text>

  <!-- API Gateway Layer -->
  <rect x="50" y="210" width="1100" height="100" class="layer-box" rx="5"/>
  <text x="70" y="235" class="layer-title">API 网关层 (API Gateway Layer)</text>

  <rect x="300" y="250" width="200" height="50" class="api-box" rx="3"/>
  <text x="400" y="270" text-anchor="middle" class="title-text">FastAPI + Uvicorn</text>
  <text x="400" y="285" text-anchor="middle" class="subtitle-text">app.py</text>

  <rect x="540" y="250" width="150" height="50" class="api-box" rx="3"/>
  <text x="615" y="265" text-anchor="middle" class="title-text">POST /api/query</text>
  <text x="615" y="280" text-anchor="middle" class="subtitle-text">查询接口</text>
  <text x="615" y="293" text-anchor="middle" style="font-size: 9px; fill: #78716c;">GET /api/courses</text>

  <!-- Core Business Layer -->
  <rect x="50" y="340" width="1100" height="180" class="layer-box" rx="5"/>
  <text x="70" y="365" class="layer-title">核心业务层 (Core Business Layer)</text>

  <rect x="120" y="380" width="180" height="60" class="business-box" rx="3"/>
  <text x="210" y="405" text-anchor="middle" class="title-text">RAG System</text>
  <text x="210" y="420" text-anchor="middle" class="subtitle-text">rag_system.py</text>
  <text x="210" y="433" text-anchor="middle" style="font-size: 9px; fill: #78716c;">核心协调器</text>

  <rect x="330" y="380" width="150" height="60" class="business-box" rx="3"/>
  <text x="405" y="405" text-anchor="middle" class="title-text">Session Manager</text>
  <text x="405" y="420" text-anchor="middle" class="subtitle-text">session_manager.py</text>
  <text x="405" y="433" text-anchor="middle" style="font-size: 9px; fill: #78716c;">会话管理</text>

  <rect x="510" y="380" width="150" height="60" class="business-box" rx="3"/>
  <text x="585" y="405" text-anchor="middle" class="title-text">AI Generator</text>
  <text x="585" y="420" text-anchor="middle" class="subtitle-text">ai_generator.py</text>
  <text x="585" y="433" text-anchor="middle" style="font-size: 9px; fill: #78716c;">AI生成器</text>

  <rect x="690" y="380" width="150" height="60" class="business-box" rx="3"/>
  <text x="765" y="405" text-anchor="middle" class="title-text">Tool Manager</text>
  <text x="765" y="420" text-anchor="middle" class="subtitle-text">search_tools.py</text>
  <text x="765" y="433" text-anchor="middle" style="font-size: 9px; fill: #78716c;">工具管理</text>

  <rect x="870" y="380" width="180" height="60" class="business-box" rx="3"/>
  <text x="960" y="405" text-anchor="middle" class="title-text">Document Processor</text>
  <text x="960" y="420" text-anchor="middle" class="subtitle-text">document_processor.py</text>
  <text x="960" y="433" text-anchor="middle" style="font-size: 9px; fill: #78716c;">文档处理器</text>

  <rect x="120" y="455" width="150" height="50" class="business-box" rx="3"/>
  <text x="195" y="475" text-anchor="middle" class="title-text">Config Manager</text>
  <text x="195" y="490" text-anchor="middle" class="subtitle-text">config.py</text>

  <rect x="300" y="455" width="130" height="50" class="business-box" rx="3"/>
  <text x="365" y="475" text-anchor="middle" class="title-text">Data Models</text>
  <text x="365" y="490" text-anchor="middle" class="subtitle-text">models.py</text>

  <!-- AI Service Layer -->
  <rect x="50" y="550" width="550" height="100" class="layer-box" rx="5"/>
  <text x="70" y="575" class="layer-title">AI 服务层 (AI Service Layer)</text>

  <rect x="120" y="590" width="180" height="50" class="ai-box" rx="3"/>
  <text x="210" y="610" text-anchor="middle" class="title-text">Claude Sonnet 4</text>
  <text x="210" y="625" text-anchor="middle" class="subtitle-text">Anthropic API</text>

  <rect x="330" y="590" width="150" height="50" class="ai-box" rx="3"/>
  <text x="405" y="610" text-anchor="middle" class="title-text">Tool Calling</text>
  <text x="405" y="625" text-anchor="middle" class="subtitle-text">工具调用机制</text>

  <!-- Data Storage Layer -->
  <rect x="630" y="550" width="520" height="180" class="layer-box" rx="5"/>
  <text x="650" y="575" class="layer-title">数据存储层 (Data Storage Layer)</text>

  <rect x="700" y="590" width="180" height="60" class="data-box" rx="3"/>
  <text x="790" y="610" text-anchor="middle" class="title-text">Vector Store</text>
  <text x="790" y="625" text-anchor="middle" class="subtitle-text">vector_store.py</text>
  <text x="790" y="640" text-anchor="middle" style="font-size: 9px; fill: #78716c;">向量存储管理</text>

  <rect x="910" y="590" width="200" height="60" class="data-box" rx="3"/>
  <text x="1010" y="610" text-anchor="middle" class="title-text">ChromaDB</text>
  <text x="1010" y="625" text-anchor="middle" class="subtitle-text">本地向量数据库</text>
  <text x="1010" y="640" text-anchor="middle" style="font-size: 9px; fill: #78716c;">./chroma_db</text>

  <rect x="700" y="665" width="180" height="50" class="data-box" rx="3"/>
  <text x="790" y="685" text-anchor="middle" class="title-text">Course Catalog</text>
  <text x="790" y="700" text-anchor="middle" class="subtitle-text">课程目录集合</text>

  <rect x="910" y="665" width="200" height="50" class="data-box" rx="3"/>
  <text x="1010" y="685" text-anchor="middle" class="title-text">Course Content</text>
  <text x="1010" y="700" text-anchor="middle" class="subtitle-text">课程内容集合</text>

  <!-- Embedding Service -->
  <rect x="50" y="760" width="550" height="100" class="layer-box" rx="5"/>
  <text x="70" y="785" class="layer-title">嵌入服务层 (Embedding Service Layer)</text>

  <rect x="180" y="800" width="280" height="50" class="ai-box" rx="3"/>
  <text x="320" y="820" text-anchor="middle" class="title-text">Sentence Transformers</text>
  <text x="320" y="835" text-anchor="middle" class="subtitle-text">all-MiniLM-L6-v2 本地模型</text>

  <!-- Arrows showing data flow -->
  <!-- Frontend to API -->
  <path d="M 635 170 L 400 250" class="arrow-bold"/>

  <!-- API to Business -->
  <path d="M 400 300 L 210 380" class="arrow-bold"/>

  <!-- Business Layer connections -->
  <line x1="210" y1="440" x2="405" y2="440" class="arrow"/>
  <line x1="210" y1="440" x2="585" y2="440" class="arrow"/>
  <line x1="585" y1="440" x2="765" y2="440" class="arrow"/>

  <!-- AI Generator to Claude -->
  <path d="M 585 440 L 210 590" class="arrow"/>

  <!-- Tool Manager to Vector Store -->
  <path d="M 765 440 L 790 590" class="arrow"/>

  <!-- Vector Store to ChromaDB -->
  <line x1="880" y1="620" x2="910" y2="620" class="arrow"/>

  <!-- ChromaDB to Collections -->
  <line x1="1010" y1="650" x2="790" y2="665" class="arrow"/>
  <line x1="1010" y1="650" x2="1010" y2="665" class="arrow"/>

  <!-- Document Processor to Embedding -->
  <path d="M 960 440 L 320 800" class="arrow"/>

  <!-- Embedding to Vector Store -->
  <path d="M 320 800 L 790 650" class="arrow"/>

  <!-- Legend -->
  <text x="50" y="885" style="font-family: Arial; font-size: 11px; fill: #64748b;">
    数据流向: 用户请求 → API → RAG引擎 → AI/工具 → 向量数据库 → 生成答案
  </text>
  <line x1="750" y1="880" x2="800" y2="880" class="arrow-bold"/>
  <text x="810" y="885" style="font-family: Arial; font-size: 11px; fill: #64748b;">主数据流</text>
  <line x1="900" y1="880" x2="950" y2="880" class="arrow"/>
  <text x="960" y="885" style="font-family: Arial; font-size: 11px; fill: #64748b;">组件连接</text>
</svg>
