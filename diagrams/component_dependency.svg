<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950">
  <defs>
    <style>
      .entry-box { fill: #86efac; stroke: #16a34a; stroke-width: 2.5; }
      .core-box { fill: #93c5fd; stroke: #2563eb; stroke-width: 2; }
      .service-box { fill: #fcd34d; stroke: #f59e0b; stroke-width: 2; }
      .util-box { fill: #c4b5fd; stroke: #7c3aed; stroke-width: 2; }
      .external-box { fill: #fca5a5; stroke: #dc2626; stroke-width: 2; }
      .model-box { fill: #d8b4fe; stroke: #a855f7; stroke-width: 2; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .import-arrow { stroke: #3b82f6; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-blue); stroke-dasharray: 5,3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" style="font-family: Arial; font-size: 26px; font-weight: bold; fill: #0f172a;">
    组件依赖关系图
  </text>
  <text x="600" y="52" text-anchor="middle" style="font-family: Arial; font-size: 13px; fill: #64748b;">
    Component Dependency Diagram
  </text>

  <!-- Entry Point -->
  <rect x="500" y="90" width="200" height="60" class="entry-box" rx="5"/>
  <text x="600" y="113" text-anchor="middle" class="title-text">app.py</text>
  <text x="600" y="128" text-anchor="middle" class="subtitle-text">应用入口</text>
  <text x="600" y="141" text-anchor="middle" style="font-size: 9px; fill: #15803d;">FastAPI Application</text>

  <!-- Core Engine -->
  <rect x="500" y="200" width="200" height="60" class="core-box" rx="5"/>
  <text x="600" y="223" text-anchor="middle" class="title-text">rag_system.py</text>
  <text x="600" y="238" text-anchor="middle" class="subtitle-text">RAG 核心引擎</text>
  <text x="600" y="251" text-anchor="middle" style="font-size: 9px; fill: #1e40af;">System Orchestrator</text>

  <!-- Left Side Components -->
  <!-- AI Generator -->
  <rect x="100" y="320" width="200" height="60" class="service-box" rx="5"/>
  <text x="200" y="343" text-anchor="middle" class="title-text">ai_generator.py</text>
  <text x="200" y="358" text-anchor="middle" class="subtitle-text">AI 生成器</text>
  <text x="200" y="371" text-anchor="middle" style="font-size: 9px; fill: #b45309;">Claude Integration</text>

  <!-- Vector Store -->
  <rect x="350" y="320" width="200" height="60" class="service-box" rx="5"/>
  <text x="450" y="343" text-anchor="middle" class="title-text">vector_store.py</text>
  <text x="450" y="358" text-anchor="middle" class="subtitle-text">向量存储</text>
  <text x="450" y="371" text-anchor="middle" style="font-size: 9px; fill: #b45309;">Vector Database Manager</text>

  <!-- Document Processor -->
  <rect x="600" y="320" width="200" height="60" class="service-box" rx="5"/>
  <text x="700" y="343" text-anchor="middle" class="title-text">document_processor.py</text>
  <text x="700" y="358" text-anchor="middle" class="subtitle-text">文档处理器</text>
  <text x="700" y="371" text-anchor="middle" style="font-size: 9px; fill: #b45309;">Document Parser</text>

  <!-- Session Manager -->
  <rect x="850" y="320" width="200" height="60" class="service-box" rx="5"/>
  <text x="950" y="343" text-anchor="middle" class="title-text">session_manager.py</text>
  <text x="950" y="358" text-anchor="middle" class="subtitle-text">会话管理器</text>
  <text x="950" y="371" text-anchor="middle" style="font-size: 9px; fill: #b45309;">Session Handler</text>

  <!-- Second Level -->
  <!-- Search Tools -->
  <rect x="100" y="440" width="200" height="60" class="util-box" rx="5"/>
  <text x="200" y="463" text-anchor="middle" class="title-text">search_tools.py</text>
  <text x="200" y="478" text-anchor="middle" class="subtitle-text">工具管理</text>
  <text x="200" y="491" text-anchor="middle" style="font-size: 9px; fill: #5b21b6;">Tool Manager + CourseSearchTool</text>

  <!-- Config -->
  <rect x="350" y="440" width="200" height="60" class="util-box" rx="5"/>
  <text x="450" y="463" text-anchor="middle" class="title-text">config.py</text>
  <text x="450" y="478" text-anchor="middle" class="subtitle-text">配置管理</text>
  <text x="450" y="491" text-anchor="middle" style="font-size: 9px; fill: #5b21b6;">Configuration Manager</text>

  <!-- Models -->
  <rect x="600" y="440" width="200" height="60" class="model-box" rx="5"/>
  <text x="700" y="463" text-anchor="middle" class="title-text">models.py</text>
  <text x="700" y="478" text-anchor="middle" class="subtitle-text">数据模型</text>
  <text x="700" y="491" text-anchor="middle" style="font-size: 9px; fill: #7c3aed;">Course, Lesson, CourseChunk</text>

  <!-- External Dependencies -->
  <!-- Claude API -->
  <rect x="20" y="580" width="170" height="60" class="external-box" rx="5"/>
  <text x="105" y="603" text-anchor="middle" class="title-text">Anthropic API</text>
  <text x="105" y="618" text-anchor="middle" class="subtitle-text">Claude Sonnet 4</text>
  <text x="105" y="631" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">External Service</text>

  <!-- ChromaDB -->
  <rect x="220" y="580" width="170" height="60" class="external-box" rx="5"/>
  <text x="305" y="603" text-anchor="middle" class="title-text">ChromaDB</text>
  <text x="305" y="618" text-anchor="middle" class="subtitle-text">向量数据库</text>
  <text x="305" y="631" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">Local Database</text>

  <!-- Sentence Transformers -->
  <rect x="420" y="580" width="190" height="60" class="external-box" rx="5"/>
  <text x="515" y="600" text-anchor="middle" class="title-text">Sentence Transformers</text>
  <text x="515" y="615" text-anchor="middle" class="subtitle-text">嵌入模型</text>
  <text x="515" y="628" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">all-MiniLM-L6-v2</text>
  <text x="515" y="639" text-anchor="middle" style="font-size: 8px; fill: #991b1b;">Local Model</text>

  <!-- Python Packages -->
  <rect x="640" y="580" width="150" height="60" class="external-box" rx="5"/>
  <text x="715" y="603" text-anchor="middle" class="title-text">FastAPI</text>
  <text x="715" y="618" text-anchor="middle" class="subtitle-text">Web Framework</text>
  <text x="715" y="631" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">+ Uvicorn</text>

  <!-- Pydantic -->
  <rect x="820" y="580" width="150" height="60" class="external-box" rx="5"/>
  <text x="895" y="603" text-anchor="middle" class="title-text">Pydantic</text>
  <text x="895" y="618" text-anchor="middle" class="subtitle-text">数据验证</text>
  <text x="895" y="631" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">Data Validation</text>

  <!-- python-dotenv -->
  <rect x="1000" y="580" width="150" height="60" class="external-box" rx="5"/>
  <text x="1075" y="603" text-anchor="middle" class="title-text">python-dotenv</text>
  <text x="1075" y="618" text-anchor="middle" class="subtitle-text">环境变量</text>
  <text x="1075" y="631" text-anchor="middle" style="font-size: 9px; fill: #991b1b;">Env Manager</text>

  <!-- Main Dependencies (Solid Arrows) -->
  <line x1="600" y1="150" x2="600" y2="200" class="arrow"/>

  <!-- RAG to components -->
  <path d="M 550 260 L 250 320" class="arrow"/>
  <path d="M 580 260 L 470 320" class="arrow"/>
  <path d="M 620 260 L 680 320" class="arrow"/>
  <path d="M 650 260 L 930 320" class="arrow"/>

  <!-- AI Generator to Search Tools -->
  <line x1="200" y1="380" x2="200" y2="440" class="arrow"/>

  <!-- Search Tools to Vector Store -->
  <path d="M 300 470 L 400 380" class="arrow"/>

  <!-- Components to Config -->
  <path d="M 500 230 L 450 440" class="import-arrow"/>
  <path d="M 200 380 L 380 440" class="import-arrow"/>
  <path d="M 450 380 L 450 440" class="import-arrow"/>

  <!-- Components to Models -->
  <path d="M 600 260 L 700 440" class="import-arrow"/>
  <path d="M 450 380 L 650 440" class="import-arrow"/>
  <path d="M 700 380 L 700 440" class="import-arrow"/>

  <!-- External Dependencies -->
  <path d="M 200 440 L 105 580" class="arrow"/>
  <path d="M 450 380 L 305 580" class="arrow"/>
  <path d="M 700 380 L 515 580" class="arrow"/>
  <path d="M 600 150 L 715 580" class="import-arrow"/>
  <path d="M 700 440 L 895 580" class="import-arrow"/>
  <path d="M 450 440 L 1075 580" class="import-arrow"/>

  <!-- Info Box -->
  <rect x="50" y="720" width="1100" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="5"/>
  <text x="70" y="745" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #0f172a;">
    依赖关系说明
  </text>

  <!-- Column 1 -->
  <text x="70" y="770" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #334155;">
    核心模块:
  </text>
  <text x="70" y="790" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • app.py - 应用入口，初始化 RAG 系统
  </text>
  <text x="70" y="808" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • rag_system.py - 核心协调器，整合所有子系统
  </text>
  <text x="70" y="826" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • ai_generator.py - Claude AI 集成和工具调用
  </text>
  <text x="70" y="844" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • vector_store.py - ChromaDB 向量存储管理
  </text>

  <!-- Column 2 -->
  <text x="450" y="770" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #334155;">
    支持模块:
  </text>
  <text x="450" y="790" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • document_processor.py - 文档解析和分块
  </text>
  <text x="450" y="808" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • session_manager.py - 会话和对话历史管理
  </text>
  <text x="450" y="826" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • search_tools.py - 工具定义和执行管理
  </text>
  <text x="450" y="844" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • config.py - 配置管理（环境变量、参数）
  </text>

  <!-- Column 3 -->
  <text x="830" y="770" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #334155;">
    外部依赖:
  </text>
  <text x="830" y="790" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • Anthropic API - Claude Sonnet 4 AI 模型
  </text>
  <text x="830" y="808" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • ChromaDB - 向量数据库（本地）
  </text>
  <text x="830" y="826" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • Sentence Transformers - 文本嵌入模型
  </text>
  <text x="830" y="844" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • FastAPI + Uvicorn - Web 框架和服务器
  </text>

  <!-- Data Model -->
  <text x="70" y="870" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #334155;">
    数据模型:
  </text>
  <text x="70" y="890" style="font-family: Arial; font-size: 11px; fill: #475569;">
    • models.py - Course, Lesson, CourseChunk (Pydantic 模型)
  </text>

  <!-- Legend -->
  <text x="450" y="870" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #334155;">
    图例:
  </text>
  <line x1="450" y1="880" x2="500" y2="880" class="arrow"/>
  <text x="510" y="885" style="font-family: Arial; font-size: 11px; fill: #475569;">
    直接依赖（调用）
  </text>

  <line x1="450" y1="900" x2="500" y2="900" class="import-arrow"/>
  <text x="510" y="905" style="font-family: Arial; font-size: 11px; fill: #475569;">
    间接依赖（import）
  </text>

  <rect x="700" y="865" width="90" height="20" class="entry-box" rx="2"/>
  <text x="745" y="880" text-anchor="middle" style="font-size: 10px; fill: #15803d; font-weight: bold;">入口点</text>

  <rect x="800" y="865" width="90" height="20" class="core-box" rx="2"/>
  <text x="845" y="880" text-anchor="middle" style="font-size: 10px; fill: #1e40af; font-weight: bold;">核心模块</text>

  <rect x="900" y="865" width="90" height="20" class="service-box" rx="2"/>
  <text x="945" y="880" text-anchor="middle" style="font-size: 10px; fill: #b45309; font-weight: bold;">服务模块</text>

  <rect x="1000" y="865" width="90" height="20" class="util-box" rx="2"/>
  <text x="1045" y="880" text-anchor="middle" style="font-size: 10px; fill: #5b21b6; font-weight: bold;">工具模块</text>

  <rect x="700" y="893" width="90" height="20" class="external-box" rx="2"/>
  <text x="745" y="908" text-anchor="middle" style="font-size: 10px; fill: #991b1b; font-weight: bold;">外部依赖</text>

  <rect x="800" y="893" width="90" height="20" class="model-box" rx="2"/>
  <text x="845" y="908" text-anchor="middle" style="font-size: 10px; fill: #7c3aed; font-weight: bold;">数据模型</text>
</svg>
